<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>단면도 익스플로러 — 자리를 옮겼습니다</title>
<link rel="canonical" href="./">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#0b1220;color:#eaf4ff;font-family:"맑은 고딕","Malgun Gothic",system-ui,sans-serif;padding:24px}
  .box{max-width:460px;text-align:center;background:#132039;border:1px solid #2f4a80;
        border-radius:18px;padding:30px 26px}
  h1{font-size:20px;margin:0 0 10px}
  p{font-size:14.5px;line-height:1.7;color:#b9c9e6;margin:0 0 18px}
  a.btn{display:inline-block;background:#2f6bd8;color:#fff;text-decoration:none;
         font-weight:800;padding:13px 22px;border-radius:12px}
  small{display:block;margin-top:14px;color:#7e8fb0;font-size:12.5px}
</style>
</head>
<body>
<div class="box">
  <h1>🧊 단면도 익스플로러</h1>
  <p>이 도구는 이제 <b>저장소 첫 화면</b>에서 바로 열립니다.<br>
     잠시 뒤 자동으로 새 주소로 넘어갑니다.</p>
  <a class="btn" id="go" href="./">지금 바로 가기 →</a>
  <small>주소를 저장해 두셨다면 넘어간 뒤의 주소로 다시 저장해 주세요.</small>
</div>
<script>
  // 선생님이 주신 제출용 링크(?rc=...)나 반 지정(&cls=) 같은 값을 그대로 넘긴다
  var to = './' + (location.search || '') + (location.hash || '');
  document.getElementById('go').href = to;
  setTimeout(function(){ location.replace(to); }, 2500);
</script>
</body>
</html>
